defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/ReacherDMControl-v0
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget
  task: qpos_match

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - ep_idx

seed: 42
policy: random # ckpt name or random
policy_cache_dir: null

wood:
  enabled: false
  train: true
  val: true
  eval: true
  seed: ${seed}
  texture_path: assets/wood_texture.png
  mask_mode: static
  white_threshold: 245
  background_tolerance: 8
  static_background_path: assets/reacher_static_background.npy

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  save_video: false
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: reacher
  callables:
    # -- set state
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel

    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

output:
  filename: dmc_results.txt
