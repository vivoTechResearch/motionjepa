_target_: jepa.JEPA
latent_normalize: none

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size}
  pretrained: false
  use_mask_token: false

predictor:
  _target_: module.ARPredictor
  num_frames: ${history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

action_encoder:
  _target_: module.Embedder
  input_dim: ???
  emb_dim: ${embed_dim}

diff_encoder: null
diff_projector: null
diff_latent_predictor: null
action_raw_predictor: null

image_decoder:
  _target_: module.ImageDecoder
  input_dim: ${embed_dim}
  img_size: ${img_size}
  hidden_dim: 512
  base_channels: 64

pose_probe_linear:
  _target_: torch.nn.Linear
  in_features: ${embed_dim}
  out_features: ${probe.output_dim}
pose_probe_mlp:
  _target_: module.MLP
  input_dim: ${embed_dim}
  hidden_dim: ${probe.hidden_dim}
  output_dim: ${probe.output_dim}

projector:
  _target_: module.MLP
  input_dim: 192
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true

pred_proj:
  _target_: module.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
