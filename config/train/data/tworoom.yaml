dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 5
  name: tworoom.h5
  keys_to_load:
    - pixels
    - action
    - proprio
    - pos_target
    - ep_idx
  keys_to_cache:
    - action
    - proprio
    - pos_target
    - ep_idx

probe:
  output_dim: 4
  targets:
    - name: agent_xy
      type: vector
      col: proprio
    - name: target_xy
      type: vector
      col: pos_target
